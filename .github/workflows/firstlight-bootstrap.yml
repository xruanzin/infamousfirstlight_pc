name: First Light bootstrap checks

concurrency:
  group: firstlight-bootstrap-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [firstlight-bootstrap]
    paths-ignore:
      - "runtime/**"
      - "src/hotfix/**"
  pull_request:
    branches: [windows]

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile run_firstlight.py launcher_firstlight.py tools/firstlight_triage.py tools/firstlight_coverage.py tools/firstlight_modules.py tools/firstlight_log.py scripts/prepare.py scripts/link_modules.py scripts/content_profile.py
      - name: Pure runtime syntax
        run: cc -std=c11 -Wall -Wextra -Werror -I. -Isrc -fsyntax-only src/runtime_eventflag.c src/runtime_content.c src/runtime_file.c
      - name: Bootstrap tools load
        run: |
          python tools/firstlight_triage.py --help >/dev/null
          python tools/firstlight_coverage.py --help >/dev/null
          python tools/firstlight_modules.py --help >/dev/null
          python tools/firstlight_log.py --help >/dev/null

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Build native Windows loader
        shell: msys2 {0}
        env:
          BB_LTO: "OFF"
        run: bash build.sh
      - name: Verify bootstrap executables
        shell: msys2 {0}
        run: |
          test -s out/bb-probe.exe
          test -s out/bb-gpu-capabilities.exe
          test -s out/bb-play.exe
      - name: Build portable First Light bootstrap
        shell: pwsh
        run: |
          ./packaging/windows/package_firstlight.ps1 -Python python
      - name: Bundle native runtime DLLs
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p out/firstlight-portable/bin
          ldd out/firstlight-portable/bin/bb-probe.exe out/firstlight-portable/bin/bb-gpu-capabilities.exe |
            awk '/\/clang64\/bin\// {print $3}' | sort -u | while read -r dll; do
              cp -u "$dll" out/firstlight-portable/bin/
            done
          test -s out/firstlight-portable/FirstLightBootstrap.exe
          test -s out/firstlight-portable/FirstLightLauncher.exe
          test -s out/firstlight-portable/bin/bb-probe.exe
          test -s out/firstlight-portable/runtime/firstlight_runtime.dll
          test -s out/firstlight-portable/runtime/import_aliases.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: firstlight-bootstrap-portable
          path: out/firstlight-portable/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstlight-bootstrap-debug
          path: |
            out/bb-probe.exe
            out/bb-gpu-capabilities.exe
            out/bb-play.exe
            out/gpu-build.log
          if-no-files-found: ignore

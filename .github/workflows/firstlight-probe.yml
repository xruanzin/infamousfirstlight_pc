name: First Light core hotfix

concurrency:
  group: firstlight-core-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [firstlight-bootstrap]
    paths:
      - "gpu/**"
      - "src/runtime*.c"
      - "src/runtime*.h"
      - "src/probe.c"
      - ".github/workflows/firstlight-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Build bb-probe only
        shell: msys2 {0}
        env:
          BB_LTO: "OFF"
        run: |
          set -euo pipefail
          source ./msys2-env.sh
          for patch in gpu/patches/fsr-vulkan/*.patch; do
            if ! git -C gpu/third_party/fsr-vulkan apply --reverse --check "$PWD/$patch" 2>/dev/null; then
              git -C gpu/third_party/fsr-vulkan apply "$PWD/$patch"
            fi
          done
          cmake -S gpu -B out/gpu -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBB_PGO=off -DBB_LTO=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ >/dev/null
          if ! ninja -C out/gpu bb-probe > out/gpu-probe-build.log 2>&1; then
            grep -v '^[[]' out/gpu-probe-build.log | tail -80 >&2
            exit 1
          fi
          test -s out/gpu/bb-probe.exe
          cp out/gpu/bb-probe.exe bb-probe.exe

      - name: Publish rolling core
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firstlight-dev-probe --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create firstlight-dev-probe --repo ${{ github.repository }} --prerelease --title "First Light development core" --notes "Rolling bb-probe.exe used by the in-place update channel."
          }
          gh release upload firstlight-dev-probe bb-probe.exe --repo ${{ github.repository }} --clobber

      - name: Refresh core digest
        shell: pwsh
        run: |
          $digest = (Get-FileHash bb-probe.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          git fetch origin firstlight-bootstrap
          git checkout -B firstlight-bootstrap origin/firstlight-bootstrap
          $path = "runtime/update_manifest.json"
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files) {
            if ($file.path -eq "bin/bb-probe.exe") {
              $file.sha256 = $digest
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $path -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          if (-not (git diff --cached --quiet)) {
            git commit -m "runtime: refresh native core digest"
            git push origin HEAD:firstlight-bootstrap
          }

      - uses: actions/upload-artifact@v4
        with:
          name: firstlight-core-hotfix
          path: bb-probe.exe
          if-no-files-found: error

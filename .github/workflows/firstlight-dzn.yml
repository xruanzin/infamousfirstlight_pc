name: First Light DirectX 12 backend

concurrency:
  group: firstlight-dzn-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [firstlight-bootstrap]
    paths:
      - ".github/workflows/firstlight-dzn.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dzn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-mesa
            mingw-w64-clang-x86_64-vulkan-loader

      - name: Stage Mesa DZN and runtime dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf out/dzn
          mkdir -p out/dzn

          declare -A seen
          # Mesa's DZN loads some shader compiler helpers dynamically, so ldd(vulkan_dzn.dll)
          # alone is not enough for a portable bundle. Seed the closure with the helpers shipped
          # by the same Mesa package, then recursively copy all of their CLANG64 dependencies.
          roots=(
            /clang64/bin/vulkan_dzn.dll
            /clang64/bin/clon12compiler.dll
            /clang64/bin/libspirv_to_dxil.dll
          )
          queue=()
          for root in "${roots[@]}"; do
            if [[ -f "$root" ]]; then
              queue+=("$root")
            else
              echo "::warning::Mesa DZN helper not found: $root"
            fi
          done
          while (("${#queue[@]}")); do
            dll="${queue[0]}"
            queue=("${queue[@]:1}")
            if [[ -n "${seen[$dll]+x}" ]]; then
              continue
            fi
            seen["$dll"]=1
            cp -f "$dll" "out/dzn/$(basename "$dll")"
            while IFS= read -r dep; do
              [[ -n "$dep" ]] && queue+=("$dep")
            done < <(ldd "$dll" | awk '$3 ~ /^\/clang64\/bin\// {print $3}')
          done

          cp -f /clang64/share/vulkan/icd.d/dzn_icd.x86_64.json out/dzn/dzn_icd.x86_64.json
          test -s out/dzn/vulkan_dzn.dll
          test -s out/dzn/clon12compiler.dll
          test -s out/dzn/libspirv_to_dxil.dll
          test -s out/dzn/dzn_icd.x86_64.json
          echo "DZN bundle files:"
          ls -lh out/dzn

      - name: Add official DXIL validator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "v1.9.2609"
          $zipUrl = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$version/dxc_2026_09_29.zip"
          $zip = "out/dxc.zip"
          $extract = "out/dxc"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
          Invoke-WebRequest -Uri $zipUrl -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $dxil = Get-ChildItem $extract -Recurse -File -Filter "dxil.dll" |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $dxil) { throw "x64 dxil.dll was not found in the pinned DXC release" }
          Copy-Item $dxil.FullName "out/dzn/DXIL.dll" -Force

          $dxcompiler = Get-ChildItem $extract -Recurse -File -Filter "dxcompiler.dll" |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if ($dxcompiler) {
            Copy-Item $dxcompiler.FullName "out/dzn/dxcompiler.dll" -Force
          }

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/DirectXShaderCompiler/$version/LICENSE.TXT" -OutFile "out/dzn/DXC-LICENSE.TXT"
          $thirdParty = "https://raw.githubusercontent.com/microsoft/DirectXShaderCompiler/$version/ThirdPartyNotices.txt"
          try {
            Invoke-WebRequest -Uri $thirdParty -OutFile "out/dzn/DXC-ThirdPartyNotices.txt"
          } catch {
            Write-Warning "DXC ThirdPartyNotices.txt was not available at the pinned tag."
          }

          if (-not (Test-Path "out/dzn/DXIL.dll" -PathType Leaf)) { throw "DXIL.dll staging failed" }
          Get-Item "out/dzn/DXIL.dll" | Format-List Name,Length,VersionInfo
          if (Test-Path "out/dzn/dxcompiler.dll") {
            Get-Item "out/dzn/dxcompiler.dll" | Format-List Name,Length,VersionInfo
          }

      - name: Make portable ICD manifest and zip
        shell: pwsh
        run: |
          $manifestPath = "out/dzn/dzn_icd.x86_64.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.ICD.library_path = ".\vulkan_dzn.dll"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $manifestPath -Encoding UTF8

          $zip = "out/firstlight-dzn.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "out/dzn/*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "DZN bundle zip was not created" }

      - name: Publish rolling DZN bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firstlight-dev-dzn --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create firstlight-dev-dzn --repo ${{ github.repository }} --prerelease --title "First Light DirectX 12 backend" --notes "Portable Mesa Dozen (Vulkan over Direct3D 12) backend for AMD driver bypass testing."
          }
          gh release upload firstlight-dev-dzn out/firstlight-dzn.zip --repo ${{ github.repository }} --clobber

      - name: Refresh DZN bundle digest
        shell: pwsh
        run: |
          $digest = (Get-FileHash "out/firstlight-dzn.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          git fetch origin firstlight-bootstrap
          git checkout -B firstlight-bootstrap origin/firstlight-bootstrap
          $path = "runtime/update_manifest.json"
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          $found = $false
          foreach ($file in $manifest.files) {
            if ($file.path -eq "runtime/dzn_bundle.zip") {
              if ($file.PSObject.Properties.Name -contains "sha256") {
                $file.sha256 = $digest
              } else {
                $file | Add-Member -NotePropertyName sha256 -NotePropertyValue $digest
              }
              $found = $true
            }
          }
          if (-not $found) { throw "DZN bundle entry missing from update manifest" }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $path -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          if (-not (git diff --cached --quiet)) {
            git commit -m "runtime: refresh DirectX 12 backend digest"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              git push origin HEAD:firstlight-bootstrap
              if ($LASTEXITCODE -eq 0) { break }
              git fetch origin firstlight-bootstrap
              git rebase origin/firstlight-bootstrap
              if ($LASTEXITCODE -ne 0) { throw "Failed to rebase DZN digest update" }
              if ($attempt -eq 3) { throw "Failed to publish DZN digest after retries" }
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: firstlight-dzn
          path: out/firstlight-dzn.zip
          if-no-files-found: error
